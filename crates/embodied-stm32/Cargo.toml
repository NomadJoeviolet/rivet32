[package]
name = "embodied-stm32"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
embodied-core.workspace = true
embodied-devices.workspace = true
embodied-runtime.workspace = true
critical-section.workspace = true
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
embedded-can = "0.4"
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "ae9e6f0672af84cec8e200a94c574041844396f0", optional = true, features = ["defmt", "memory-x", "time-driver-any", "exti", "unstable-pac"] }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "ae9e6f0672af84cec8e200a94c574041844396f0", optional = true }

[build-dependencies]
stm32-metapac = { git = "https://github.com/embassy-rs/stm32-data-generated", tag = "stm32-data-caa36afd62510b0e6315ee0dccd1f9c65fbcac83", default-features = false, features = ["metadata"], optional = true }

[features]
default = []
hal = ["dep:embassy-stm32", "dep:stm32-metapac"]
usb = ["dep:embassy-usb"]
single-bank = ["embassy-stm32?/single-bank"]
dual-bank = ["embassy-stm32?/dual-bank"]
time-driver-tim1 = ["embassy-stm32?/time-driver-tim1"]
time-driver-tim2 = ["embassy-stm32?/time-driver-tim2"]
time-driver-tim3 = ["embassy-stm32?/time-driver-tim3"]
time-driver-tim4 = ["embassy-stm32?/time-driver-tim4"]
time-driver-tim5 = ["embassy-stm32?/time-driver-tim5"]
time-driver-tim8 = ["embassy-stm32?/time-driver-tim8"]
time-driver-tim9 = ["embassy-stm32?/time-driver-tim9"]
time-driver-tim12 = ["embassy-stm32?/time-driver-tim12"]
time-driver-tim15 = ["embassy-stm32?/time-driver-tim15"]
time-driver-tim19 = ["embassy-stm32?/time-driver-tim19"]
time-driver-tim20 = ["embassy-stm32?/time-driver-tim20"]
time-driver-tim21 = ["embassy-stm32?/time-driver-tim21"]
time-driver-tim22 = ["embassy-stm32?/time-driver-tim22"]
time-driver-tim23 = ["embassy-stm32?/time-driver-tim23"]
time-driver-tim24 = ["embassy-stm32?/time-driver-tim24"]


[package]
name = "@NAME@-@CORE@"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["@CHIP@"]
@CHIP@ = []

[dependencies]
embodied-framework = { workspace = true, features = ["stm32"] }
embodied-stm32 = { workspace = true, features = ["@CHIP@"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "ae9e6f0672af84cec8e200a94c574041844396f0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "ae9e6f0672af84cec8e200a94c574041844396f0", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = { version = "0.7.5", features = ["set-vtor"] }
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[build-dependencies]
stm32-metapac = { path = "../../Framework/vendor/stm32-metapac", default-features = false, features = ["metadata", "@CHIP@"] }

[[bin]]
name = "firmware-@CORE@"
path = "src/main.rs"
test = false
bench = false
